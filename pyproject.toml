[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "polymarket-market-maker-bot"
version = "1.0.0"
description = "Institutional Avellaneda-Stoikov Market Making Engine for Polymarket & Kalshi Prediction Markets"
readme = "README.md"
authors = [
    { name = "NaxosData Quant Engineering", email = "research@naxosdata.com" },
    { name = "William Gonda", email = "william@naxosdata.com" }
]
license = { text = "MIT" }
keywords = [
    "polymarket market maker",
    "kalshi market making bot",
    "avellaneda stoikov polymarket",
    "prediction market market making",
    "order flow imbalance",
    "prediction-markets",
    "quantitative-trading",
    "high-frequency-trading",
    "market-making"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial :: Investment",
]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.22.0",
    "httpx>=0.24.0",
    "requests>=2.28.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]

[project.scripts]
polymarket-mm = "market_maker.cli:main"

[project.urls]
Homepage = "https://naxosdata.com"
Documentation = "https://github.com/nexosdata/polymarket-market-maker-bot"
Repository = "https://github.com/nexosdata/polymarket-market-maker-bot"
Tracker = "https://github.com/nexosdata/polymarket-market-maker-bot/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["market_maker*"]
